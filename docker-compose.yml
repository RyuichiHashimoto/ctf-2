version: "3.9"
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./data/uploads:/app/data/uploads
      - ./data/mitre_attack.db:/app/data/mitre_attack.db:ro
      - ./data/attack_scenario.db:/app/data/attack_scenario.db:ro
    environment:
      - FRONTEND_ORIGIN=*
      - PYTHONPATH=/app/src

  frontend-angular:
    build:
      context: ./frontend-angular
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./frontend-angular:/workspace
    environment:
      - VITE_API_BASE=http://192.168.11.115:8000
      - VITE_WS_BASE=ws://192.168.11.115:8000

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=mitre_attack
      - MYSQL_USER=mitre_user
      - MYSQL_PASSWORD=mitre_pass
      - MYSQL_ROOT_PASSWORD=rootpass
    volumes:
      - mysql-data:/var/lib/mysql
    

volumes:
  backend-data:
  frontend-angular-node-modules:
  mysql-data:
