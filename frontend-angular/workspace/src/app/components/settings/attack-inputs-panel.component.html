<div class="field-group">
  <div class="field-group-header">
    <div class="field-group-title">Attack Inputs</div>
    <button type="button" class="secondary small" (click)="service.clearAttackInputs()">
      Clear
    </button>
  </div>

  <label class="field-label prominent" for="entry-point">Attacked Node</label>
  <select
    id="entry-point"
    [ngModel]="service.entryPoint"
    (ngModelChange)="onEntryPointChange($event)"
  >
    <option value="">Select node</option>
    <option *ngFor="let node of service.listNodes" [value]="node.id">
      {{ node.label }}
    </option>
  </select>

  <label class="field-label prominent" for="attack-scenario">Attack Scenario</label>
  <select
    id="attack-scenario"
    [ngModel]="service.attackScenarioId"
    (focus)="ensureScenariosLoaded()"
    (ngModelChange)="onAttackScenarioChange($event)"
  >
    <option value="">Select scenario</option>
    <option *ngFor="let scenario of service.attackScenarios" [value]="scenario.id">
      {{ scenario.name }}
    </option>
  </select>

  <label class="field-label prominent" for="attack-data">Attacker Obtained Data</label>
  <select
    id="attack-data"
    [ngModel]="service.attackData"
    (ngModelChange)="onAttackDataChange($event)"
  >
    <option value="">Select Data</option>
    <option value="Asset Locations (File Server)">Asset Locations (File Server)</option>
  </select>

  <div class="error-inline" *ngIf="service.predictError">
    {{ service.predictError }}
  </div>
</div>
