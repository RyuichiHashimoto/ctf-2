<div class="field-group">
  <div class="field-group-title">Experiments</div>

  <label class="field-label prominent" for="algorithm">探索アルゴリズム</label>
  <select
    id="algorithm"
    [ngModel]="service.selectedAlgorithm"
    (ngModelChange)="onAlgorithmChange($event)"
  >
    <option *ngFor="let algo of service.algorithms" [value]="algo.id">
      {{ algo.label }}
    </option>
  </select>

  <ng-container *ngIf="service.selectedAlgorithm === 'exhaustive_specified'">
    <label class="field-label prominent" for="exp-start-node">開始ノード</label>
    <select
      id="exp-start-node"
      [ngModel]="service.experimentStartNode"
      (ngModelChange)="service.experimentStartNode = $event"
    >
      <option value="">ノードを選択</option>
      <option *ngFor="let node of service.listNodes" [value]="node.id">
        {{ node.label }}
      </option>
    </select>

    <label class="field-label prominent" for="exp-end-node">終了ノード</label>
    <select
      id="exp-end-node"
      [ngModel]="service.experimentEndNode"
      (ngModelChange)="service.experimentEndNode = $event"
    >
      <option value="">ノードを選択</option>
      <option *ngFor="let node of service.listNodes" [value]="node.id">
        {{ node.label }}
      </option>
    </select>
  </ng-container>

  <label class="field-label prominent" for="config-preset">実験設定</label>
  <select
    id="config-preset"
    [ngModel]="service.selectedConfigPreset"
    (ngModelChange)="service.selectedConfigPreset = $event"
  >
    <option *ngFor="let preset of service.configPresets" [value]="preset.id">
      {{ preset.label }}
    </option>
  </select>

  <div class="button-row">
    <button
      type="button"
      (click)="run()"
      [disabled]="!service.selectedUploadId || service.experimentRunning"
    >
      {{ service.experimentRunning ? '実行中...' : 'Run' }}
    </button>
  </div>

  <div class="error-inline" *ngIf="service.experimentError">
    {{ service.experimentError }}
  </div>
</div>
