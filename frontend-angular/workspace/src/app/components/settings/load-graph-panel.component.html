<div class="field-group">
  <div class="field-group-header">
    <div class="field-group-title">Graph Selection</div>
    <button type="button" class="secondary small" (click)="refresh()">Refresh</button>
  </div>

  <label class="field-label prominent" for="uploaded-graph">Uploaded Graph</label>
  <select
    id="uploaded-graph"
    [ngModel]="service.selectedUploadId"
    (ngModelChange)="handleUploadSelection($event)"
  >
    <option value="">グラフを選択してください</option>
    <option *ngFor="let item of service.uploadedGraphs" [value]="item.file_id">
      {{ item.filename }}
    </option>
  </select>

  <div class="helper-text" *ngIf="service.uploadedGraphs.length === 0 && !loadError">
    アップロード済みのグラフはありません。
  </div>
  <div class="error-inline" *ngIf="loadError">{{ loadError }}</div>
  <div class="helper-text" *ngIf="service.graphError">{{ service.graphError }}</div>
</div>
